<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gửi báo cáo - Green Alert</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span>🌱</span> Green Alert</a><button class="menu-btn" id="menuBtn">☰</button><nav id="navMenu"><a href="index.html">Trang chủ</a><a href="alerts.html">Cảnh báo</a><a href="map.html">Bản đồ</a><a class="active" href="report.html">Gửi báo cáo</a><a href="knowledge.html">Kiến thức</a><a href="admin.html">Quản trị</a></nav></div></header><main><section class="section"><div class="container report-grid"><div><span class="eyebrow">THAM GIA CỘNG ĐỒNG</span><h2>Gửi báo cáo môi trường</h2><p>Nội dung người dùng gửi là báo cáo cộng đồng, không được xem là số liệu quan trắc chính thức cho đến khi được xác minh.</p></div><form id="reportForm" class="form-card"><label>Loại vấn đề<select id="type" required><option value="">-- Chọn loại --</option><option>Rác thải</option><option>Ô nhiễm không khí</option><option>Ô nhiễm nước</option><option>Tiếng ồn</option><option>Khác</option></select></label><label>Địa điểm<input id="location" required placeholder="Ví dụ: Phường/xã, khu vực..."></label><label>Mô tả<textarea id="description" required placeholder="Mô tả vấn đề bạn phát hiện..."></textarea></label><label>Hình ảnh<input type="file" accept="image/*"></label><button class="btn primary full" type="submit">GỬI BÁO CÁO</button></form></div></section></main><footer><div class="container footer"><div><b>🌱 Green Alert</b><p>Công nghệ số vì môi trường xanh.</p></div><div><b>Nhóm 7</b></div></div></footer><div id="toast"></div><script src="script.js"></script></body></html>
